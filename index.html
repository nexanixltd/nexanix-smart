<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexanix Smart Assistant</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app">
<header><div class="brand">NEXANIX</div><div><h1>Smart Assistant</h1><p>Agentic home & personal workflow simulator</p></div><span class="badge">Alexa+ Simulation</span></header>
<section class="chat" id="chat"><div class="message assistant"><strong>Nexanix</strong><p>Hi! I can coordinate your home routines, calendar, tasks and shopping list. Try <em>“Prepare movie night for Friday at 8”</em>.</p></div></section>
<section class="suggestions">
<button data-prompt="Prepare movie night for Friday at 8">Movie night</button>
<button data-prompt="What's on my calendar today?">Calendar</button>
<button data-prompt="Add popcorn to my shopping list">Shopping</button>
<button data-prompt="Create a quiet evening routine">Routine</button></section>
<form id="composer"><input id="input" autocomplete="off" placeholder="Ask Nexanix to do something..."><button type="submit">Send</button></form>
</main><script src="app.js"></script></body></html>
